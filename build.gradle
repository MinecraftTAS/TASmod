plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "com.palantir.git-version" version "4.2.0"
	id "com.diffplug.spotless" version "8.1.0"
}

// set basic properties
def hash = ""
if(project.release=="false") {
	hash = "-SNAPSHOT_"+versionDetails().gitHash.substring(0,7)
}
version = project.version+hash
group = project.group

base {
	archivesName = project.artifact
}

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

loom {
	// set access widener
	accessWidenerPath = file("src/main/resources/tasmod.accesswidener")
	// add log4jconfig
	log4jConfigs.from(file("src/main/resources/log4j.xml"))
}

// dependency repositories
repositories {
	mavenCentral()
	maven { url = "https://maven.minecrafttas.com/main" }
	maven { url = "https://maven.legacyfabric.net/" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://repo.spongepowered.org/maven" }
}

// dependencies
dependencies {
	// tasmod dependencies
	implementation "com.dselent:bigarraylist:1.6"
	include "com.dselent:bigarraylist:1.6"
	implementation "com.github.KaptainWutax:SeedUtils:b6a383113c"
	include "com.github.KaptainWutax:SeedUtils:b6a383113c"

	// loom dependencies
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "org.lwjgl:lwjgl-glfw:3.4.3"

	// testing dependencies
	testImplementation "org.junit.jupiter:junit-jupiter:5.14.1"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}


compileJava {
	options.release = 25
}

// process fabric mod json
processResources {
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "mod_url": project.mod_url, "name": project.mod_name, "mod_version": project.version, "mod_description": project.mod_description, "mod_sources": project.mod_sources, "mod_email": project.mod_email
	}
}

// configure jar file
jar {
	from {
		configurations.include.collect { it.isDirectory() ? it : zipTree(it) }
	} {
		exclude "LICENSE.txt", "META-INF/MANIFEST.MF", "META-INF/maven/**", "META-INF/*.RSA", "META-INF/*.SF"
	}
}

// configure testing
tasks.named("test", Test) {
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
	}
}

spotless {
	encoding "UTF-8"
	lineEndings "UNIX"
	java {
		importOrderFile("formatter/TASmodImportorder.txt")
		eclipse().configFile("formatter/TASmodFormatter.xml")
	}
	enforceCheck false
}
